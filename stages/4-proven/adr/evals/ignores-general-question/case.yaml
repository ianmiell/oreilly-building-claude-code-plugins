schema_version: "1.1"
name: ignores-general-question
description: Should not fire. A question about ADRs gets an answer, not a new file.
tags: [does-not-fire]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "What's an ADR, and when is it worth a team writing one?"
  max_turns: 10
  allowed_tools: [Skill, Read, Write, Edit, Glob, Grep, Bash]
graders:
  - type: file_exists
    name: no-file-written
    path: "**/*"
    exists: false
  - type: tool_used
    name: skill-not-invoked
    tool: Skill
    min: 0
    max: 0
    arm: both
  - type: llm
    name: answers-the-question
    criteria: |
      PASS if the reply explains that an ADR (Architecture Decision Record) records an architectural decision with its context and consequences, and gives at least one situation where writing one is worthwhile.
      FAIL if the reply only offers to write an ADR without explaining what one is.
