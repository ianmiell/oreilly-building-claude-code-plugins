schema_version: "1.1"
name: asks-for-missing-reason
description: With no reason given, the plugin asks for one instead of inventing it.
tags: [fires]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Record a decision: we're moving the orders API from REST to GraphQL."
  max_turns: 15
  allowed_tools: [Skill, Read, Write, Edit, Glob, Grep, Bash]
graders:
  - type: file_exists
    name: no-adr-written-yet
    path: docs/adr/0003-*.md
    exists: false
  - type: llm
    name: asks-why
    criteria: |
      PASS if the reply asks the user why the team is moving to GraphQL (the context or reason for the decision).
      FAIL if the reply makes up a reason, or says an ADR has been written.
